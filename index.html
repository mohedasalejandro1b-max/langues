<title>Polyglocio — A new way to live languages.</title>
<style>
:root{
  color-scheme:light;
  --bg:#f8f6f2;--paper:#fffdfa;--ink:#282135;
  --muted:#62596c;--line:#ded9e3;--border:#84738f;
  --purple:#7540e8;--accent:#6225ce;--lilac:#e8def8;
  --soft:#f0ece7;--deep:#282135;--on-deep:#fffaf1;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#18151f;--paper:#211c2a;--ink:#f6f0ff;
  --muted:#c5bacf;--line:#44374f;--border:#9c89aa;
  --purple:#b499ff;--accent:#c5abff;--lilac:#352844;
  --soft:#292331;--deep:#30223f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button,a,input,select,textarea,summary{-webkit-tap-highlight-color:transparent}
:where(a,button,input,select,textarea,summary):focus-visible{
  outline:3px solid var(--accent);outline-offset:4px;
}
[hidden]{display:none!important}
::selection{background:var(--lilac);color:var(--ink)}
.wrap{width:min(1120px,calc(100% - 40px));margin:auto}
.sheet{
  margin:24px 0;background:var(--paper);
  border:1px solid var(--line);border-radius:24px;
  padding:44px 50px;
}
header{position:relative;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{font-size:29px;font-weight:800;letter-spacing:-1.8px;line-height:1}
.brand span{color:var(--purple)}
.tagline{font-size:10px;color:var(--muted);margin:8px 0 0}
.nav{display:flex;align-items:center;gap:18px;margin-left:auto}
.nav a{font-size:12px;font-weight:600}
.nav a:hover{color:var(--accent)}
.controls{display:flex;align-items:center;gap:8px}
.icon-button,.menu-button{
  border:1px solid var(--border);background:var(--paper);
  color:var(--ink);min-height:44px;border-radius:100px;
}
.icon-button{width:44px;height:44px;padding:0;display:grid;place-items:center}
.icon-button:hover{background:var(--lilac);color:var(--accent)}
.menu-button{padding:9px 14px;display:none;font-size:12px}
.language{position:relative;z-index:40}
.language-panel{
  position:absolute;right:0;top:54px;width:210px;padding:9px;
  border:1px solid var(--border);border-radius:17px;
  background:var(--paper);box-shadow:0 14px 35px #17102126;
}
.language-panel p{
  font-size:9px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--muted);text-align:center;margin:5px 8px 8px;
}
.language-option{
  position:relative;width:100%;min-height:44px;padding:11px 30px;
  border:0;border-radius:10px;text-align:center;
  background:transparent;color:var(--ink);font-size:13px;font-weight:600;
}
.language-option:hover{background:var(--soft)}
.language-option[aria-pressed="true"]{background:var(--lilac);color:var(--accent)}
.language-option[aria-pressed="true"]:after{
  content:"✓";position:absolute;right:13px;
}
.hero{display:grid;grid-template-columns:1.12fr 1fr;gap:45px;align-items:center;margin-top:64px}
.eyebrow{
  color:var(--accent);font-size:10px;letter-spacing:1.8px;
  text-transform:uppercase;font-weight:700;line-height:1.7;
}
h1,h2,h3,p{margin:0}
h1{
  font-size:clamp(43px,5.5vw,65px);line-height:1.03;
  letter-spacing:-3px;font-weight:600;margin:22px 0 28px;
}
h1 em{font-style:normal;color:var(--purple)}
h2{font-size:clamp(29px,4vw,41px);line-height:1.15;letter-spacing:-1.4px;font-weight:500;margin:12px 0 18px}
h3{font-size:23px;line-height:1.3;letter-spacing:-.5px;font-weight:500}
.lead{font-size:16px;color:var(--muted);max-width:650px}
.hero-actions{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:28px}
.button{
  display:inline-flex;align-items:center;justify-content:center;
  gap:16px;min-height:46px;padding:13px 21px;border-radius:100px;
  border:1px solid var(--border);background:var(--paper);
  color:var(--ink);font-size:13px;font-weight:700;text-align:center;
}
.button.primary{background:var(--purple);border-color:var(--purple);color:white}
.button.primary:hover{background:#6028ce;border-color:#6028ce}
[data-theme="dark"] .button.primary{color:#211433}
[data-theme="dark"] .button.primary:hover{background:#cbb8ff;border-color:#cbb8ff}
.button.secondary:hover{background:var(--soft)}
.text-link{font-size:13px;text-decoration:underline;text-underline-offset:5px;color:var(--muted)}
.text-link:hover{color:var(--accent)}
.trust,.note{font-size:12px;margin-top:16px;line-height:1.7}
.note{color:var(--muted)}
.hero-art{
  background:var(--lilac);border-radius:110px 110px 20px 20px;
  padding:42px 22px 24px;position:relative;overflow:hidden;
}
.art-star{font-size:39px;color:var(--accent);text-align:center;margin-bottom:14px}
.greeting{position:relative;background:var(--paper);padding:23px;border-radius:16px;margin:14px 0}
.greeting.green{background:#dfedb7;color:#374229}
.greeting small{font-size:9px;letter-spacing:1px;font-weight:700}
.greeting strong{display:block;font:italic 44px/1.2 Georgia,serif;margin:8px 0}
.greeting a{font-size:18px;text-decoration:underline;text-underline-offset:5px}
.art-price{padding:8px 4px 0;font-size:10px}
.art-price strong{font-size:26px;display:block;font-weight:600}
.experience{margin-top:55px;border-top:1px solid var(--line);padding-top:26px}
.three,.two,.workshops{display:grid;gap:18px}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.steps{margin-top:23px}
.step-number{color:var(--accent);font-size:11px;margin-bottom:12px}
.step p,.card p{color:var(--muted);font-size:14px;margin-top:11px}
.step h3{font-size:22px}
.section-head{margin-bottom:27px}
.card{border:1px solid var(--line);border-radius:18px;padding:26px;min-width:0}
.card.lilac{background:var(--lilac)}
.card.soft{background:var(--soft)}
.card .button{margin-top:24px}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);font-weight:700}
.price{font-size:42px;line-height:1.15;letter-spacing:-1.5px;margin:18px 0 8px}
.price small{font-size:12px;letter-spacing:0;color:var(--muted)}
.standard{font-size:12px;color:var(--muted);margin-top:15px}
.facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:20px}
.fact{padding:6px 10px;border-radius:100px;border:1px solid var(--border);font-size:10px;color:var(--accent)}
.calendar{background:var(--lilac);border:1px solid var(--line);border-radius:17px;padding:24px;margin:25px 0}
.calendar h3{font-size:20px;margin:8px 0}
.calendar p{color:var(--muted);font-size:13px}
.course-extras{margin-top:18px}
.course-extras summary{font-weight:600;cursor:pointer}
.course-extras p{font-size:13px;color:var(--muted);margin-top:13px}
.workshops{grid-template-columns:repeat(3,minmax(0,1fr))}
.workshop-icon{font:italic 36px Georgia,serif;color:var(--accent);margin-bottom:18px}
.workshops h3{font-size:21px}
.qualification{background:var(--lilac);border:1px solid var(--line);border-radius:17px;padding:24px;margin:24px 0}
.qualification p{font-size:15px;color:var(--muted);margin-top:12px}
.route{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.route button{
  border:1px solid var(--border);border-radius:100px;padding:10px 15px;
  background:var(--paper);color:var(--ink);font-size:12px;
}
.route button[aria-pressed="true"]{background:var(--lilac);color:var(--accent);border-color:var(--accent)}
.route-story{margin-top:17px;color:var(--muted);font-size:14px}
.practice-tabs{display:flex;gap:10px;margin:23px 0}
.practice-tabs button[aria-pressed="true"]{background:var(--lilac);color:var(--accent)}
.game{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:28px;margin-top:18px}
.game .scene{font:italic 27px/1.3 Georgia,serif;margin-bottom:15px}
.game p{margin:12px 0}
.game-options{display:grid;gap:10px;margin-top:19px}
.game-options button{
  text-align:left;padding:14px 17px;background:var(--paper);color:var(--ink);
  border:1px solid var(--border);border-radius:11px;
}
.game-options button:hover{background:var(--lilac)}
.game-feedback{min-height:30px;font-size:14px;margin:18px 0}
.game .button{margin-top:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.field{display:block;min-width:0}
.field.wide{grid-column:1/-1}
.field span{font-size:13px;font-weight:600;display:block;margin-bottom:8px}
input,select,textarea{
  width:100%;min-height:48px;border:1px solid var(--border);
  background:var(--paper);color:var(--ink);border-radius:10px;padding:11px 12px;
}
textarea{min-height:100px;resize:vertical}
.form-actions{margin-top:24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.form-error{color:#992540;margin-bottom:20px;font-size:14px}
[data-theme="dark"] .form-error{color:#ffb3c6}
.summary{background:var(--lilac);border:1px solid var(--line);padding:25px;border-radius:17px;margin-top:28px}
.summary dl{margin:20px 0}
.summary dl>div{display:grid;grid-template-columns:130px 1fr;gap:15px;padding:10px 0;border-bottom:1px solid var(--line)}
.summary dt{color:var(--muted);font-size:12px}
.summary dd{margin:0;font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap}
.summary-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
footer{padding:15px 0 40px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.skip{position:fixed;top:-100px;left:20px;z-index:100;background:var(--paper);padding:14px;border:1px solid var(--border)}
.skip:focus{top:10px}
@media(max-width:900px){
  .nav{display:none;position:absolute;top:calc(100% + 12px);left:0;right:0;
    z-index:30;background:var(--paper);border:1px solid var(--border);border-radius:15px;padding:14px}
  .nav.open{display:flex;flex-direction:column;align-items:stretch}
  .nav a{padding:10px 12px;font-size:14px}
  .menu-button{display:block}
  .controls{margin-left:auto}
  .hero{gap:26px}
  .workshops{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:650px){
  .wrap{width:calc(100% - 24px)}
  .sheet{padding:29px 22px;border-radius:18px;margin:12px 0}
  .brand-block{flex-basis:100%}
  header{gap:15px}
  .language-panel{left:50%;right:auto;transform:translateX(-50%)}
  .hero{grid-template-columns:1fr;margin-top:38px}
  h1{font-size:48px;letter-spacing:-2.5px}
  .hero-art{margin-top:10px}
  .three,.two,.workshops,.form-grid{grid-template-columns:1fr}
  .field.wide{grid-column:auto}
  .experience{margin-top:35px}
  .step{padding:16px 0;border-top:1px solid var(--line)}
  .step:first-child{border-top:0}
  .card{padding:23px}
  .summary dl>div{grid-template-columns:1fr;gap:3px}
  .summary-actions .button{width:100%}
  .calendar{padding:21px}
  footer{padding:24px 4px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{transition:none!important;animation:none!important}
}
</style>

const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const starts=["2027-02-01","2027-09-06"];
let lang="en",theme="light";
try{
  const saved=localStorage.getItem("polyglocio-language");
  if(copy[saved])lang=saved;
  theme=localStorage.getItem("polyglocio-theme")||
    (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
}catch{}
if(!["light","dark"].includes(theme))theme="light";

const t=()=>copy[lang];
const currency=n=>new Intl.NumberFormat(lang,{
  style:"currency",currency:"EUR",maximumFractionDigits:0
}).format(n);
const startLabel=index=>new Intl.DateTimeFormat(lang,{
  weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"
}).format(new Date(starts[index]+"T12:00:00Z"));
const globe=`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>`;

function options(values,current){
  return values.map(([value,label])=>`<option value="${esc(value)}" ${value===current?"selected":""}>${esc(label)}</option>`).join("");
}
function rememberForm(){
  const form=document.querySelector("#class-form");
  if(!form)return;
  for(const key of Object.keys(formState)){
    if(form.elements[key])formState[key]=form.elements[key].value;
  }
}
function formatLabel(){
  return formState.format==="group"?t().groupOption:
    formState.format==="private"?t().privateOption:t().examOption;
}
function rows(){
  const c=t(),labels=c.summaryLabels;
  const result=[
    [labels.language,formState.language==="French"?c.french:c.spanish],
    [labels.format,formatLabel()],
    [labels.level,formState.level==="unsure"?c.unsure:formState.level]
  ];
  if(formState.format==="group"){
    const index=Number(formState.intake);
    result.push(
      [labels.intake,c.intakes[index]],
      [labels.start,startLabel(index)],
      [labels.hours,c.hours],
      [labels.price,`${currency(800)} — ${c.standard}; ${currency(720)} — ${c.upfront}`]
    );
  }else{
    result.push([labels.price,formState.format==="private"?`${currency(25)} / ${c.perHour}`:c.quoted]);
  }
  result.push(
    [labels.goals,formState.goals.trim()||c.discuss],
    [labels.name,formState.name.trim()],
    [labels.email,formState.email.trim()]
  );
  return result;
}
function requestText(){
  return `${t().hello}\n\n${t().emailIntro}\n\n`+
    rows().map(([label,value])=>`${label}: ${value}`).join("\n")+
    `\n\n${t().emailEnd}\n\n${t().noPayment}`;
}
function renderSummary(){
  const target=document.querySelector("#summary");
  if(!prepared){target.hidden=true;return}
  const c=t();
  const mail="mailto:alex.mohedas@icloud.com?subject="+
    encodeURIComponent(c.subject)+"&body="+encodeURIComponent(requestText());
  target.hidden=false;
  target.innerHTML=`
    <h3>${c.ready}</h3><p class="note">${c.readyNote}</p>
    <dl>${rows().map(([key,value])=>`<div><dt>${esc(key)}</dt><dd>${esc(value)}</dd></div>`).join("")}</dl>
    <div class="summary-actions">
      <a class="button primary" href="${esc(mail)}">${c.send} →</a>
      <button class="button secondary" type="button" data-download>${c.download} ↓</button>
      ${formState.format==="group"?`<button class="button secondary" type="button" data-calendar>${c.reminder} ↓</button>`:""}
    </div>
    ${formState.format==="group"?`<p class="note">${c.reminderNote}</p>`:""}`;
}

  form.elements.format.addEventListener("change",()=>{
    rememberForm();
    const group=formState.format==="group";
    document.querySelector("#intake-field").hidden=!group;
    form.elements.intake.disabled=!group;
  });
  form.addEventListener("submit",event=>{
    event.preventDefault();rememberForm();
    const name=form.elements.name,email=form.elements.email;
    if(!name.value.trim()||!email.checkValidity()){
      document.querySelector("#form-error").hidden=false;
      (!name.value.trim()?name:email).focus();return;
    }
    document.querySelector("#form-error").hidden=true;
    prepared=true;renderSummary();
    document.querySelector("#summary").scrollIntoView({block:"start"});
  });
}

const games={
fr:{
  place:"Une matinée à Paris.",
  steps:[
    {text:"Marianne veut acheter une baguette. Où doit-elle aller ?",options:["À la pharmacie","À la boulangerie","À la banque"],answer:1,yes:"Exactement ! On achète le pain à la boulangerie.",no:"Essayez encore : cherchez le commerce qui vend du pain."},
    {text:"Vous entrez dans la boulangerie. Que dites-vous ?",options:["Bonjour, je voudrais une baguette, s’il vous plaît.","Où est la gare ?","Je cherche un livre."],answer:0,yes:"Très bien ! Une demande claire et polie.",no:"Choisissez la phrase qui permet de commander du pain."},
    {text:"La boulangère vous donne votre baguette. Vous répondez…",options:["Je suis perdu.","Merci, au revoir !","Je voudrais réserver une chambre."],answer:1,yes:"Bravo ! Votre mission est accomplie.",no:"Quelle formule utilise-t-on pour remercier et prendre congé ?"}
  ],
  next:"Continuer →",retry:"Recommencer",done:"Bravo ! Marianne a sa baguette. À bientôt pour une nouvelle conversation."
},
es:{
  place:"Un libro en Buenos Aires.",
  steps:[
    {text:"Pablo quiere comprar El Aleph, de Borges. ¿Adónde debe ir?",options:["A la farmacia","A la panadería","A la librería"],answer:2,yes:"¡Exacto! Los libros se compran en la librería.",no:"Probá otra vez: buscá el comercio que vende libros."},
    {text:"Entrás a la librería. ¿Qué decís?",options:["Hola, estoy buscando El Aleph, de Borges.","Quisiera una baguette.","¿Dónde está el aeropuerto?"],answer:0,yes:"¡Muy bien! Explicaste claramente qué libro buscás.",no:"Elegí la frase que sirve para pedir un libro."},
    {text:"El librero te entrega el libro. ¿Cómo respondés?",options:["No hablo francés.","¡Gracias! ¡Hasta luego!","Quiero ir al hospital."],answer:1,yes:"¡Excelente! Completaste tu misión.",no:"Elegí una forma de agradecer y despedirte."}
  ],
  next:"Continuar →",retry:"Volver a empezar",done:"¡Muy bien! Pablo ya tiene su libro. Hasta la próxima aventura."

};
function renderGame(){
  const host=document.querySelector("#game"),g=games[gameState.language];
  host.lang=gameState.language;
  if(gameState.step>=g.steps.length){
    host.innerHTML=`<div class="scene">${g.place}</div><p>${g.done}</p><button type="button" class="button secondary" data-game-reset>${g.retry}</button>`;
    return;
  }
  const step=g.steps[gameState.step];
  host.innerHTML=`
    <div class="eyebrow">${gameState.step+1} / ${g.steps.length}</div>
    <div class="scene">${g.place}</div><p>${step.text}</p>
    <div class="game-options">${step.options.map((text,i)=>`<button type="button" data-answer="${i}">${text}</button>`).join("")}</div>
    <p class="game-feedback" id="game-feedback" role="status"></p>
    <button type="button" class="button primary" data-game-next hidden>${g.next}</button>`;
}
function closeLanguage(focus=false){
  const panel=document.querySelector("#language-panel"),button=document.querySelector("#language-button");
  panel.hidden=true;button.setAttribute("aria-expanded","false");
  if(focus)button.focus();
}
function openLanguage(){
  document.querySelector("#navigation").classList.remove("open");
  document.querySelector("#menu-button").setAttribute("aria-expanded","false");
  document.querySelector("#language-panel").hidden=false;
  document.querySelector("#language-button").setAttribute("aria-expanded","true");
  document.querySelector(`[data-language="${lang}"]`).focus();
}
function download(text,name,type="text/plain;charset=utf-8"){
  const url=URL.createObjectURL(new Blob([text],{type}));
  const a=document.createElement("a");a.href=url;a.download=name;
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function calendar(){
  const start=starts[Number(formState.intake)];
  const end=new Date(start+"T12:00:00Z");end.setUTCDate(end.getUTCDate()+1);
  const compact=x=>x.replaceAll("-","");
  const stamp=new Date().toISOString().replace(/[-:]|\.\d{3}/g,"");
  const lines=[
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Polyglocio//Course Preview//EN",
    "CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:polyglocio-preview-"+compact(start)+"@polyglocio.example",
    "DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+compact(start),
    "DTEND;VALUE=DATE:"+compact(end.toISOString().slice(0,10)),
    `SUMMARY;LANGUAGE=${lang}:[${t().preview}] ${t().calendarTitle}`,
    `DESCRIPTION;LANGUAGE=${lang}:${t().reminderNote}`,
    "STATUS:TENTATIVE","TRANSP:TRANSPARENT","END:VEVENT","END:VCALENDAR"
  ];
  const folded=lines.map(line=>{
    let out="",part="",bytes=0;
    for(const char of line){
      const size=new TextEncoder().encode(char).length;
      if(bytes+size>74){out+=part+"\r\n";part=" ";bytes=1}
      part+=char;bytes+=size;
    }
    return out+part;
  }).join("\r\n")+"\r\n";
  download(folded,"polyglocio-course-preview.ics","text/calendar;charset=utf-8");
}
document.addEventListener("click",event=>{
  const target=event.target.closest("button,a");
  if(!target)return;
  if(target.id==="language-button"){
    document.querySelector("#language-panel").hidden?openLanguage():closeLanguage();
    return;
  }
  if(target.dataset.language){
    const selected=target.dataset.language;
    if(selected===lang){closeLanguage(true);return}
    rememberForm();const y=window.scrollY;lang=selected;
    try{localStorage.setItem("polyglocio-language",lang)}catch{}
    render();requestAnimationFrame(()=>window.scrollTo(0,y));
    document.querySelector("#language-button").focus({preventScroll:true});return;
  }
  if(target.id==="theme-button"){
    theme=theme==="dark"?"light":"dark";
    document.documentElement.dataset.theme=theme;
    try{localStorage.setItem("polyglocio-theme",theme)}catch{}
    target.textContent=theme==="dark"?"☀":"☾";
    target.setAttribute("aria-pressed",String(theme==="dark"));
    target.setAttribute("aria-label",theme==="dark"?t().day:t().night);
    return;
  }
  if(target.id==="menu-button"){
    closeLanguage();
    const open=document.querySelector("#navigation").classList.toggle("open");
    target.setAttribute("aria-expanded",String(open));return;
  }
  if(target.dataset.format||target.dataset.courseLanguage){
    rememberForm();
    if(target.dataset.format)formState.format=target.dataset.format;
    if(target.dataset.courseLanguage)formState.language=target.dataset.courseLanguage;
    prepared=false;
    const form=document.querySelector("#class-form");
    form.elements.format.value=formState.format;
    form.elements.language.value=formState.language;
    const group=formState.format==="group";
    form.elements.intake.disabled=!group;
    document.querySelector("#intake-field").hidden=!group;
    document.querySelector("#summary").hidden=true;
  }
  if(target.dataset.route!==undefined){
    routeIndex=Number(target.dataset.route);
    document.querySelectorAll("[data-route]").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.route)===routeIndex)));
    document.querySelector("#route-story").textContent=t().stories[routeIndex];
  }
  if(target.dataset.game){
    gameState={language:target.dataset.game,step:0,correct:false};
    document.querySelectorAll("[data-game]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.game===gameState.language)));
    renderGame();
  }
  if(target.dataset.answer!==undefined){
    const step=games[gameState.language].steps[gameState.step];
    gameState.correct=Number(target.dataset.answer)===step.answer;
    document.querySelector("#game-feedback").textContent=gameState.correct?step.yes:step.no;
    document.querySelector("[data-game-next]").hidden=!gameState.correct;
  }
  if(target.hasAttribute("data-game-next")){
    gameState.step++;gameState.correct=false;renderGame();
    document.querySelector("#game button")?.focus();
  }
  if(target.hasAttribute("data-game-reset")){
    gameState.step=0;gameState.correct=false;renderGame();
    document.querySelector("#game button")?.focus();
  }
  if(target.hasAttribute("data-download"))download(requestText(),"polyglocio-class-request.txt");
  if(target.hasAttribute("data-calendar"))calendar();
  if(target.closest("#navigation")){
    document.querySelector("#navigation").classList.remove("open");
    document.querySelector("#menu-button").setAttribute("aria-expanded","false");
  }
});
document.addEventListener("click",event=>{
  if(!event.target.closest(".language"))closeLanguage();
});
document.addEventListener("focusout",event=>{
  if(event.target.closest(".language")&&!event.relatedTarget?.closest(".language"))closeLanguage();
});
document.addEventListener("keydown",event=>{
  const panel=document.querySelector("#language-panel");
  if(event.key==="Escape"){
    if(!panel.hidden){event.preventDefault();closeLanguage(true)}
    else{
      const nav=document.querySelector("#navigation");
      if(nav.classList.contains("open")){
        nav.classList.remove("open");
        document.querySelector("#menu-button").setAttribute("aria-expanded","false");
        document.querySelector("#menu-button").focus();
      }
    }
    return;
  }
  if(event.target.id==="language-button"&&["ArrowDown","ArrowUp"].includes(event.key)){
    event.preventDefault();openLanguage();return;
  }
  if(!panel.hidden&&event.target.closest(".language")&&["ArrowDown","ArrowUp","Home","End"].includes(event.key)){
    event.preventDefault();
    const buttons=[...panel.querySelectorAll("button")];
    const current=buttons.indexOf(document.activeElement);
    const next=event.key==="Home"?0:event.key==="End"?buttons.length-1:
      (current+(event.key==="ArrowDown"?1:-1)+buttons.length)%buttons.length;
    buttons[next].focus();
  }
});
render();
</script>
